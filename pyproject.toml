[project]
name = "probe-monitor-control"
version = "0.1.0"
description = "Does a small code monitor know more than it says? Linear probes on a trusted model vs its own suspicion score, on ControlArena Apps."
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "control-arena>=20.0.1",
    "huggingface-hub>=1.33.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "torch>=2.5",
    "transformers>=4.51",
]
